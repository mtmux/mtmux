services:
  relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.relay
    ports:
      - "14300:14300"
    env_file: .env
    volumes:
      - /tmp/tmux-1000:/tmp/tmux-1000
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "14100:14100"
    env_file: .env
    depends_on:
      - relay
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    ports:
      - "14102:14102"
    env_file: .env
    restart: unless-stopped
