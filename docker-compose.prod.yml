services:
  relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.relay
    ports:
      - "${RELAY_PORT:-24300}:24300"
    env_file: .env
    volumes:
      - /tmp/tmux-1000:/tmp/tmux-1000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const h=require('http');h.get('http://localhost:24300/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ccremote

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "${WEB_PORT:-24100}:24100"
    env_file: .env
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:24100"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ccremote

  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile.docs
    ports:
      - "${DOCS_PORT:-24102}:24102"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:24102"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ccremote

  # Optional reverse proxy — enable with `--profile nginx`.
  # Terminates HTTP by default; uncomment the HTTPS block in
  # nginx/docker/default.conf once you've mounted TLS certs.
  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/docker/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Bring-your-own-cert: mount the host's letsencrypt dir to use certs
      # issued by certbot on the host. Keep read-only.
      - ./nginx/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      relay:
        condition: service_healthy
      docs:
        condition: service_healthy
    networks:
      - ccremote

networks:
  ccremote:
    driver: bridge
