  <rect x="2.5" y="4.5" width="8.5" height="15" rx="1.75" fill="#0A0B0A" />
  <rect x="13" y="4.5" width="8.5" height="7" rx="1.75" fill="#0A0B0A" />
  <rect x="13" y="12.5" width="8.5" height="7" rx="1.75" fill="#0A0B0A" />
</svg>
