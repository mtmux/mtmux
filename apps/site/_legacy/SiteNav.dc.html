<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./support.js"></script>
</head>

<body>
  <x-dc>
    <nav
      style="display:flex;align-items:center;justify-content:space-between;gap:24px;height:58px;padding:0 clamp(16px,4vw,40px);background:rgba(10,11,10,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #1C211A;font-family:'IBM Plex Mono',ui-monospace,monospace">
      <a href="index.html"
        style="display:flex;align-items:center;gap:9px;text-decoration:none;color:#EAE7DE;flex:0 0 auto">
        <span
          style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#A6E96B;color:#0A0B0A;font-size:15px;font-weight:700;border-radius:3px;letter-spacing:-0.06em">▚</span>
        <span style="font-size:17.5px;font-weight:600;letter-spacing:-0.03em">mtmux</span>
      </a>

      <div style="display:none;align-items:center;gap:2px" data-nav-links="desktop">
        <a href="Features.dc.html"
          style="position:relative;padding:8px 12px;font-size:15px;color:#B2B8A4;text-decoration:none;letter-spacing:-0.01em;border-radius:5px"
          style-hover="color:#EAE7DE;background:#141712">features<sc-if value="{{ isFeatures }}"><span
              style="position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:#A6E96B"></span></sc-if></a>
        <a href="Integrations.dc.html"
          style="position:relative;padding:8px 12px;font-size:15px;color:#B2B8A4;text-decoration:none;letter-spacing:-0.01em;border-radius:5px"
          style-hover="color:#EAE7DE;background:#141712">agents<sc-if value="{{ isIntegrations }}"><span
              style="position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:#A6E96B"></span></sc-if></a>
        <a href="Docs.dc.html"
          style="position:relative;padding:8px 12px;font-size:15px;color:#B2B8A4;text-decoration:none;letter-spacing:-0.01em;border-radius:5px"
          style-hover="color:#EAE7DE;background:#141712">docs<sc-if value="{{ isDocs }}"><span
              style="position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:#A6E96B"></span></sc-if></a>
        <a href="Compare.dc.html"
          style="position:relative;padding:8px 12px;font-size:15px;color:#B2B8A4;text-decoration:none;letter-spacing:-0.01em;border-radius:5px"
          style-hover="color:#EAE7DE;background:#141712">compare<sc-if value="{{ isCompare }}"><span
              style="position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:#A6E96B"></span></sc-if></a>
        <a href="Security.dc.html"
          style="position:relative;padding:8px 12px;font-size:15px;color:#B2B8A4;text-decoration:none;letter-spacing:-0.01em;border-radius:5px"
          style-hover="color:#EAE7DE;background:#141712">security<sc-if value="{{ isSecurity }}"><span
              style="position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:#A6E96B"></span></sc-if></a>
        <a href="Pricing.dc.html"
          style="position:relative;padding:8px 12px;font-size:15px;color:#B2B8A4;text-decoration:none;letter-spacing:-0.01em;border-radius:5px"
          style-hover="color:#EAE7DE;background:#141712">pricing<sc-if value="{{ isPricing }}"><span
              style="position:absolute;left:12px;right:12px;bottom:2px;height:1.5px;background:#A6E96B"></span></sc-if></a>
      </div>

      <div style="display:flex;align-items:center;gap:10px;flex:0 0 auto">
        <a href="https://github.com/mtmux/mtmux"
          style="display:none;align-items:center;gap:7px;padding:7px 11px;font-size:14.5px;color:#B2B8A4;text-decoration:none;border:1px solid #23281F;border-radius:6px"
          style-hover="color:#EAE7DE;border-color:#3A4234" data-nav-links="desktop">
          <span style="color:#8A917C">★</span>7.4k
        </a>
        <a href="Docs.dc.html"
          style="display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:15px;font-weight:600;color:#0A0B0A;background:#A6E96B;text-decoration:none;border-radius:6px;letter-spacing:-0.01em"
          style-hover="background:#B9F084">
          <span style="opacity:0.55">$</span>install
        </a>
        <button type="button" onClick="{{ toggleMenu }}" aria-label="Menu"
          style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:transparent;border:1px solid #23281F;border-radius:6px;color:#B2B8A4;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:16px;cursor:pointer"
          style-hover="color:#EAE7DE;border-color:#3A4234" data-nav-burger="1">≡</button>
      </div>
    </nav>

    <sc-if value="{{ menuOpen }}">
      <div
        style="display:grid;gap:2px;padding:10px clamp(16px,4vw,40px) 18px;background:#0C0E0C;border-bottom:1px solid #1C211A;font-family:'IBM Plex Mono',ui-monospace,monospace">
        <a href="Features.dc.html"
          style="padding:11px 4px;font-size:16px;color:#DCD8CB;text-decoration:none;border-bottom:1px solid #161A14">features</a>
        <a href="Integrations.dc.html"
          style="padding:11px 4px;font-size:16px;color:#DCD8CB;text-decoration:none;border-bottom:1px solid #161A14">agents
          &amp; notifications</a>
        <a href="Docs.dc.html"
          style="padding:11px 4px;font-size:16px;color:#DCD8CB;text-decoration:none;border-bottom:1px solid #161A14">docs</a>
        <a href="Compare.dc.html"
          style="padding:11px 4px;font-size:16px;color:#DCD8CB;text-decoration:none;border-bottom:1px solid #161A14">compare</a>
        <a href="Security.dc.html"
          style="padding:11px 4px;font-size:16px;color:#DCD8CB;text-decoration:none;border-bottom:1px solid #161A14">security</a>
        <a href="Pricing.dc.html"
          style="padding:11px 4px;font-size:16px;color:#DCD8CB;text-decoration:none;border-bottom:1px solid #161A14">pricing</a>
        <a href="Changelog.dc.html"
          style="padding:11px 4px;font-size:16px;color:#DCD8CB;text-decoration:none">changelog</a>
      </div>
    </sc-if>
  </x-dc>
  <script type="text/x-dc" data-dc-script
    data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:120},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;features&quot;,&quot;integrations&quot;,&quot;docs&quot;,&quot;compare&quot;,&quot;security&quot;,&quot;pricing&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false, wide: true };
  componentDidMount() {
    this.mq = window.matchMedia('(min-width: 900px)');
    this.sync = () => {
      const wide = this.mq.matches;
      document.querySelectorAll('[data-nav-links="desktop"]').forEach(el => {
        el.style.display = wide ? 'flex' : 'none';
      });
      document.querySelectorAll('[data-nav-burger]').forEach(el => {
        el.style.display = wide ? 'none' : 'flex';
      });
      if (wide && this.state.menuOpen) this.setState({ menuOpen: false });
    };
    this.sync();
    this.mq.addEventListener('change', this.sync);
    this.raf = requestAnimationFrame(this.sync);
  }
  componentDidUpdate() { if (this.sync) this.sync(); }
  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', this.sync);
    cancelAnimationFrame(this.raf);
  }
  renderVals() {
    const a = this.props.active || '';
    return {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      isFeatures: a === 'features',
      isIntegrations: a === 'integrations',
      isDocs: a === 'docs',
      isCompare: a === 'compare',
      isSecurity: a === 'security',
      isPricing: a === 'pricing'
    };
  }
}
</script>
</body>

</html>
